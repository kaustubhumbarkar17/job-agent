[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-agent"
version = "0.1.0"
description = "Job-Hunt Agent: discover, score, and draft emails for job applications"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "jsonschema>=4",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "typer",
    "rich",
    "questionary",
    "numpy",
    "tenacity",
    "firecrawl-py",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "respx", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[project.scripts]
job-agent = "agent.cli:app"

[tool.pytest.ini_options]
addopts = "-m 'not live_local'"
markers = ["live_local: requires a running local Ollama and installed models"]
